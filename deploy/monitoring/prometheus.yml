# Prometheus scrape configuration for VeriShield (add every application server).
scrape_configs:
  - job_name: verishield
    scheme: https
    metrics_path: /metrics
    scrape_interval: 30s
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/verishield_metrics_token   # value of VERISHIELD_METRICS_TOKEN
    tls_config:
      ca_file: /etc/prometheus/bank-ca.pem
    static_configs:
      - targets: ["verishield-app1.bop.local:8443", "verishield-app2.bop.local:8443"]
rule_files:
  - verishield-alerts.yml
