<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge Assistant</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1b1f24; --muted: #5d6673; --line: #dde1e6;
    --accent: #1f6feb; --accent-text: #ffffff; --user: #e8f0fe; --bot: #ffffff; --err: #b42318;
    --ok: #1a7f37; --warn: #9a6700; --code: #f0f2f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --panel: #171b21; --text: #e6e9ee; --muted: #9aa4b2; --line: #2a313a;
      --accent: #4c8dff; --accent-text: #0b0d10; --user: #1c2a42; --bot: #171b21; --err: #ff7b72;
      --ok: #56d364; --warn: #e3b341; --code: #0f1216;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px;
           border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .meta { color: var(--muted); font-size: 13px; margin-left: auto; text-align: right; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--err); }
  main { display: grid; grid-template-columns: 1fr 320px; gap: 16px; padding: 16px 20px;
         max-width: 1200px; margin: 0 auto; height: calc(100vh - 54px); }
  .chat { display: flex; flex-direction: column; min-height: 0; background: var(--panel);
          border: 1px solid var(--line); border-radius: 10px; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 85%; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); white-space: pre-wrap; }
  .msg.user { align-self: flex-end; background: var(--user); border-color: transparent; }
  .msg.bot { align-self: flex-start; background: var(--bot); }
  .msg.err { color: var(--err); }
  .msg .tag { display: block; color: var(--muted); font-size: 12px; margin-top: 6px; }
  details { margin-top: 8px; font-size: 13px; color: var(--muted); }
  details pre { white-space: pre-wrap; background: var(--code); padding: 8px; border-radius: 6px; margin: 4px 0; }
  .empty { margin: auto; color: var(--muted); text-align: center; max-width: 420px; }
  .empty button { margin: 4px; }
  form.ask { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); flex-wrap: wrap; }
  textarea, input, select { font: inherit; color: var(--text); background: var(--bg);
                            border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  form.ask textarea { flex: 1 1 300px; resize: none; height: 44px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text);
           border-radius: 8px; padding: 8px 14px; cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .55; cursor: wait; }
  aside { display: flex; flex-direction: column; gap: 16px; overflow-y: auto; min-height: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 8px 0 4px; }
  .card select, .card input, .card textarea { width: 100%; }
  ul.docs { list-style: none; padding: 0; margin: 0; font-size: 14px; }
  ul.docs li { padding: 6px 0; border-bottom: 1px solid var(--line); }
  ul.docs li:last-child { border-bottom: 0; }
  ul.docs small { color: var(--muted); display: block; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  .note { font-size: 12px; color: var(--muted); margin-top: 8px; }
  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; height: auto; padding: 12px 16px; }
    .chat { height: 70vh; }
    header { padding: 12px 16px; }
  }
</style>
</head>
<body>
<header>
  <h1>Knowledge Assistant</h1>
  <div class="meta" id="conn"><span class="dot"></span>Connecting…</div>
</header>
<main>
  <section class="chat">
    <div id="log">
      <div class="empty" id="empty">
        <p>Ask anything about the documents in your TrustGraph workspace.</p>
        <button data-q="What is VeriShield and what problems does it solve?">What is VeriShield?</button>
        <button data-q="Which fraud detection techniques and models are described?">Detection techniques</button>
        <button data-q="What regulatory reports does the system produce?">Regulatory reports</button>
      </div>
    </div>
    <form class="ask" id="askForm">
      <textarea id="q" placeholder="Ask a question… (Enter to send, Shift+Enter for a new line)"></textarea>
      <button class="primary" id="send">Ask</button>
    </form>
  </section>
  <aside>
    <div class="card">
      <h2>Settings</h2>
      <label for="mode">Answer with</label>
      <select id="mode">
        <option value="graph-rag">Graph RAG (knowledge graph)</option>
        <option value="document-rag">Document RAG (text chunks)</option>
        <option value="agent">Agent (reasoning + tools)</option>
        <option value="llm">LLM only (no retrieval)</option>
      </select>
      <label for="flow">Flow</label>
      <select id="flow"></select>
      <label for="collection">Collection</label>
      <select id="collection"></select>
    </div>
    <div class="card">
      <h2>Documents</h2>
      <ul class="docs" id="docs"><li><small>Loading…</small></li></ul>
    </div>
    <div class="card">
      <h2>Add knowledge</h2>
      <form id="upForm">
        <label for="title">Title</label>
        <input id="title" name="title" required placeholder="e.g. Card fraud policy 2026">
        <label for="file">PDF or text file</label>
        <input id="file" name="file" type="file" accept=".pdf,.txt,.md">
        <label for="text">…or paste text</label>
        <textarea id="text" name="text" rows="4"></textarea>
        <div class="row"><button class="primary" id="upBtn">Add &amp; process</button></div>
        <div class="note" id="upNote">Processing extracts entities and relationships into the graph; large documents take several minutes.</div>
      </form>
    </div>
  </aside>
</main>
<script>
const $ = (id) => document.getElementById(id);
const log = $("log");

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function addMsg(cls, html) {
  $("empty")?.remove();
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.innerHTML = html;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

function fillSelect(sel, values, preferred) {
  const current = sel.value || preferred;
  sel.innerHTML = values.map(v => `<option>${esc(v)}</option>`).join("");
  if (values.includes(current)) sel.value = current;
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail ? (typeof data.detail === "string" ? data.detail : JSON.stringify(data.detail)) : r.statusText);
  return data;
}

async function refresh() {
  try {
    const s = await api("/api/status");
    $("conn").innerHTML = `<span class="dot ok"></span>${esc(s.workspace)} · ${esc(new URL(s.server).host)}`;
    fillSelect($("flow"), s.flows, s.default_flow);
    fillSelect($("collection"), s.collections, s.default_collection);
    $("docs").innerHTML = s.documents.length ? s.documents.map(d => `<li>${esc(d.title)}
      <small>${esc(d.kind)} · ${d.flows.length ? "submitted to " + esc(d.flows.join(", ")) : "not submitted to a flow"}</small></li>`).join("")
      : "<li><small>No documents yet.</small></li>";
  } catch (e) {
    $("conn").innerHTML = `<span class="dot bad"></span>${esc(e.message)}`;
  }
}

async function ask(question) {
  addMsg("user", esc(question));
  const mode = $("mode").value;
  const pending = addMsg("bot", `<span class="tag">Thinking (${esc(mode)})…</span>`);
  $("send").disabled = true;
  try {
    const r = await api("/api/ask", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({question, mode, flow: $("flow").value || null, collection: $("collection").value || null})});
    const steps = r.steps.length ? `<details><summary>Agent reasoning (${r.steps.length} steps)</summary>${
      r.steps.map(s => `<pre><b>${esc(s.kind)}</b>\n${esc(s.text)}</pre>`).join("")}</details>` : "";
    pending.innerHTML = esc(r.answer || "(empty answer — has a document been processed into this flow and collection?)")
      + steps + `<span class="tag">${esc(r.mode)} · flow ${esc(r.flow)} · ${r.seconds}s</span>`;
  } catch (e) {
    pending.classList.add("err");
    pending.textContent = "Error: " + e.message;
  } finally {
    $("send").disabled = false;
    log.scrollTop = log.scrollHeight;
  }
}

$("askForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const q = $("q").value.trim();
  if (!q) return;
  $("q").value = "";
  ask(q);
});
$("q").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("askForm").requestSubmit(); }
});
log.addEventListener("click", (e) => { if (e.target.dataset.q) ask(e.target.dataset.q); });

$("upForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const fd = new FormData($("upForm"));
  if (!$("file").files.length) fd.delete("file");
  fd.set("flow", $("flow").value);
  fd.set("collection", $("collection").value);
  $("upBtn").disabled = true;
  $("upNote").textContent = "Uploading…";
  try {
    await api("/api/documents", {method: "POST", body: fd});
    $("upNote").textContent = "Added and sent for processing. Answers will improve as extraction finishes.";
    $("upForm").reset();
    refresh();
  } catch (err) {
    $("upNote").textContent = "Error: " + err.message;
  } finally {
    $("upBtn").disabled = false;
  }
});

refresh();
setInterval(refresh, 30000);
</script>
</body>
</html>
